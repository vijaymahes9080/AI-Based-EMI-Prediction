  <text x="55" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9ca3af" letter-spacing="1">ML FINANCIAL HEALTH INDEX</text>
  <rect x="260" y="130" width="125" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="272" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981">Exceptional Standing</text>

