  <text x="778" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">EMI Predictor</text>
  <text x="895" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">Visual Analytics</text>
  <text x="1005" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af">SHAP Explain</text>

