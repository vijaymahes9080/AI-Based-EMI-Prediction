  <text x="960" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">NET MONTHLY SAVINGS</text>
  <text x="960" y="180" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff">$38,246</text>
  <text x="960" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">After living &amp; EMI expenses</text>

  <!-- Big Graph Container -->
  <rect x="430" y="280" width="740" height="320" rx="16" fill="#111827" fill-opacity="0.9" stroke="#1f2937" stroke-width="1.5"/>
  <text x="460" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9ca3af" letter-spacing="1">3, 6, 12 MONTH FUTURE SPENDING &amp; SAVINGS TREND</text>

  <!-- Graph Paths -->
  <path d="M 470 540 Q 650 480 830 500 T 1130 460" fill="none" stroke="#f43f5e" stroke-width="4"/>
  <path d="M 470 420 Q 650 380 830 400 T 1130 360" fill="none" stroke="#10b981" stroke-width="4"/>
