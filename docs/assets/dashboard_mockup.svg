  <text x="90" y="66" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="url(#brandGrad)">FinPulse AI</text>
  <rect x="220" y="47" width="160" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
