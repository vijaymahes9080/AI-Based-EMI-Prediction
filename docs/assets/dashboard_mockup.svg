  <circle cx="220" cy="270" r="90" fill="none" stroke="url(#gaugeGrad)" stroke-width="16" stroke-dasharray="565" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(135 220 270)"/>
  <text x="220" y="265" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">85</text>
