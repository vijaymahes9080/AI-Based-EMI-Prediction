  <rect x="685" y="110" width="230" height="150" rx="16" fill="#111827" fill-opacity="0.9" stroke="#10b981" stroke-width="1"/>
  <text x="705" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981">RECOMMENDED MAX EMI</text>
  <text x="705" y="180" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff">$26,400</text>
  <text x="705" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Safe income threshold</text>

