<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg2)" rx="16"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1f2937" stroke-width="2" rx="15"/>

  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">EXPLAINABLE AI (SHAP FEATURE ATTRIBUTION)</text>
  <text x="50" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#9ca3af">Local TreeExplainer impact breakdown for individual prediction score</text>

  <!-- SHAP Bars -->
  <!-- 1. Credit Score -->
  <rect x="50" y="130" width="1100" height="75" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <text x="80" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Credit Score Rating (760)</text>
  <text x="1050" y="160" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#10b981">+28.4 pts</text>
  <rect x="80" y="175" width="850" height="12" rx="6" fill="#10b981"/>

  <!-- 2. Debt to Income Ratio -->
  <rect x="50" y="220" width="1100" height="75" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <text x="80" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Debt-To-Income Ratio (28.4%)</text>
  <text x="1050" y="250" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#10b981">+22.1 pts</text>
  <rect x="80" y="265" width="680" height="12" rx="6" fill="#10b981"/>

  <!-- 3. Emergency Reserve -->
  <rect x="50" y="310" width="1100" height="75" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <text x="80" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Emergency Fund Buffer (6.4 Months)</text>
  <text x="1050" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#10b981">+18.5 pts</text>
  <rect x="80" y="355" width="550" height="12" rx="6" fill="#10b981"/>

  <!-- 4. High House Rent -->
  <rect x="50" y="400" width="1100" height="75" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">House Rent Expense Burden ($22,000/mo)</text>
  <text x="1050" y="430" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#f43f5e">-12.4 pts</text>
  <rect x="80" y="445" width="380" height="12" rx="6" fill="#f43f5e"/>

  <!-- 5. Existing Home Loan EMI -->
  <rect x="50" y="490" width="1100" height="75" rx="12" fill="#1e293b" fill-opacity="0.6"/>
  <text x="80" y="520" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Existing Home Loan EMI Commitment</text>
  <text x="1050" y="520" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#f43f5e">-8.2 pts</text>
  <rect x="80" y="535" width="240" height="12" rx="6" fill="#f43f5e"/>
</svg>
