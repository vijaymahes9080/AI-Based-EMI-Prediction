<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#181016" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)" rx="16"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#f43f5e" stroke-opacity="0.3" stroke-width="2" rx="15"/>

  <text x="50" y="60" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff">MONTE CARLO ECONOMIC STRESS TEST &amp; SURVIVAL SIMULATOR</text>
  <text x="50" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#9ca3af">Resilience evaluation under 1,000 simulated macroeconomic shocks</text>

  <!-- Scenario Cards Grid -->
  <rect x="50" y="120" width="200" height="120" rx="12" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Temporary Job Loss</text>
  <text x="70" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#fda4af">4 months income drop</text>
  <text x="70" y="215" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#f43f5e">32.4% Risk</text>

  <rect x="280" y="120" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Inflation Surge (+6%)</text>
  <text x="300" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Living costs spike</text>
  <text x="300" y="215" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#f59e0b">14.2% Risk</text>

  <rect x="510" y="120" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="530" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Rate Spike (+3.0%)</text>
  <text x="530" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Variable rate hike</text>
  <text x="530" y="215" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#f59e0b">18.6% Risk</text>

  <rect x="740" y="120" width="200" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="760" y="150" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Medical Shock</text>
  <text x="760" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">$15,000 emergency</text>
  <text x="760" y="215" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8">8.5% Risk</text>

  <!-- Big Result Output Box -->
  <rect x="50" y="270" width="1100" height="310" rx="16" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1.5"/>
  <text x="90" y="320" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#9ca3af">SURVIVAL BUFFER EVALUATION</text>
  <text x="90" y="380" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#38bdf8">14.2 Months</text>
  <text x="90" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#10b981">Liquid capital buffer remains positive for over 1 year under job loss scenario.</text>
</svg>
